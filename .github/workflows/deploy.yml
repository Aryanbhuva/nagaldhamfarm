name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments; never cancel a running deploy
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Job 1: Build and push Docker image to GHCR
  # ============================================================================
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: meta
        run: echo "short_sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: app
          push: true
          tags: |
            ghcr.io/aryanbhuva/nagaldhamfarm:${{ steps.meta.outputs.short_sha }}
            ghcr.io/aryanbhuva/nagaldhamfarm:latest
          cache-from: type=gha,mode=max
          cache-to: type=gha,mode=max

  # ============================================================================
  # Job 2: Deploy to EC2 via SSH
  # ============================================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_SSH_PORT || 22 }}
          # Secrets are injected as environment variables, never echoed
          envs: IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            cd /opt/nagaldhamfarm
            git pull origin main || true
            ./deploy/deploy.sh "$IMAGE_TAG"

        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT }}
