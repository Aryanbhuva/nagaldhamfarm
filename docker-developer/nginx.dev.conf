# ==============================================================================
# Nagaldham Farm — Local Developer Nginx Configuration
# Listen: Port 80 (inside container) -> Mapped to DEV_PORT (default 8080) on host
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    root /var/www/html/public;
    index index.php index.html;

    # Health check ping endpoint for Docker
    location /ping {
        access_log off;
        return 200 "pong\n";
    }

    # Laravel Front Controller Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP scripts to PHP-FPM container (app service on port 9000)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Static assets caching disabled for local development
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        access_log off;
    }

    # Block access to hidden files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/dev_access.log;
    error_log /var/log/nginx/dev_error.log;
}
