# ==============================================================================
# Nagaldham Farm — Production Nginx Docker Configuration
# Domain: nagaldhamfarm.shop / www.nagaldhamfarm.shop
# SSL: Let's Encrypt certificates mounted from /etc/letsencrypt
# Ports: 80 (HTTP) -> 443 (HTTPS)
# ==============================================================================

# Redirect HTTP to HTTPS & ACME challenge
server {
    listen 80;
    listen [::]:80;
    server_name nagaldhamfarm.shop www.nagaldhamfarm.shop localhost 127.0.0.1;

    # Health check ping endpoint for Docker
    location /ping {
        access_log off;
        return 200 "pong\n";
    }

    # Let's Encrypt ACME challenge (for certificate renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nagaldhamfarm.shop www.nagaldhamfarm.shop;

    # Root directory pointing to Laravel's public directory inside container
    root /var/www/html/public;
    index index.php index.html;

    # SSL Certificate & Key (mounted from host /etc/letsencrypt)
    ssl_certificate /etc/letsencrypt/live/nagaldhamfarm.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nagaldhamfarm.shop/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Maximum upload size
    client_max_body_size 64M;

    charset utf-8;

    # Laravel Front Controller Routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health check ping endpoint for Docker
    location /ping {
        access_log off;
        return 200 "pong\n";
    }

    # Pass PHP scripts to PHP-FPM container (app service on port 9000)
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Block access to hidden files (e.g. .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Logs
    access_log /var/log/nginx/nagaldhamfarm_access.log;
    error_log /var/log/nginx/nagaldhamfarm_error.log;
}
