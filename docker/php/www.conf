[www]
user = www-data
group = www-data

listen = 9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 20
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

ping.path = /ping
ping.response = pong

pm.status_path = /status

catch_workers_output = yes
decorate_workers_output = no
